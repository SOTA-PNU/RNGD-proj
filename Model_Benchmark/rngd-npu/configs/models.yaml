# 모델 매트릭스 (Furiosa RNGD / furiosa-llm). enabled:false는 SKIP.
# id 형식 두 가지:
#   - HF 모델 id (furiosa-ai/* 는 prebuilt 아티팩트) → furiosa-llm 이 HF Hub 에서 받음
#   - 로컬 절대경로 (artifacts/* 직접 빌드) → 그 경로를 furiosa-llm serve 가 바로 로드
# name: 결과/로그 폴더에 쓸 짧은 이름 (절대경로 id 가 폴더명으로 지저분해지는 것 방지). 없으면 id 사용.
# 하드웨어: RNGD 1장 = 8 PE. 이 머신 = 4장 = 32 PE. 모델 PE = tp × pp. 1장 HBM ≈ 48GB.
# enabled:true 항목만 측정. tp=8은 기본 1장, tp=32는 모델별 serve_args로 4장을 사용.
# gated 모델은 HF_TOKEN 필요 — `hf auth login`.

models:
  - id: furiosa-ai/Qwen2.5-0.5B-Instruct
    revision: null
    role: smoke           # 파이프라인 검증용. SWE-bench는 점수 의미 없음.
    gen: true
    enabled: false
    serve_args: []

  - id: furiosa-ai/Llama-3.1-8B-Instruct
    revision: null
    role: baseline        # v2026.2 검증된 베이스라인. bench-gpu의 meta-llama/Llama-3.1-8B 와 비교.
    gen: true
    enabled: false
    serve_args: ["--tool-call-parser", "llama3_json"]

  # ==== 직접 빌드한 로컬 아티팩트 (tp=8 = 1장) ====
  # furiosa-llm build 로 HF 원본을 tp=8 재컴파일한 결과. prebuilt(tp=32)와 달리 1장에 적재됨.
  # id 는 절대경로 — 서버가 그 경로를 그대로 로드하고 /v1/models id 도 그 경로로 등록됨.

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen3-32b-fp8-tp8
    name: Qwen3-32B-FP8-tp8
    revision: null
    role: main            # FP8 33GB, artifact max attention size 40960.
    gen: true
    enabled: true
    serve_args: ["--reasoning-parser", "qwen3"]

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen3-32b-fp8-tp8-16k
    name: Qwen3-32B-FP8-tp8-16k
    revision: null
    role: main
    gen: true
    enabled: true         # 위 qwen3-32b-fp8-tp8(40960)의 max_model_len 16384 축소판. 비교 측정용.
    serve_args: ["--reasoning-parser", "qwen3"]

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen3-coder-30b-a3b-inst-fp8-tp8-65k-tc
    name: Qwen3-Coder-30B-A3B-Instruct-FP8-tp8-65k
    revision: null
    role: coder           # FP8 MoE 30GB, artifact max attention size 65536. 완성본(-tc, binary_bundle 보유).
    gen: true             # artifact.json model_type 위장(qwen3_moe→qwen3)으로 serve 게이트 통과 → 벤치 가능.
    enabled: true
    serve_args: []

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen3-coder-30b-a3b-inst-tp8-65k-tc
    name: Qwen3-Coder-30B-A3B-Instruct-bf16-tp8-65k
    revision: null
    role: coder           # bf16 MoE 58GB > 1장 48GB HBM → serve 시 -pp 2(2장 레이어분할, 실측 가능). 위장 model_type=qwen3.
    gen: true
    enabled: true
    serve_args: ["-pp", "2", "--devices", "npu:0,npu:1"]

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen2.5-coder-14b-tp8
    name: Qwen2.5-Coder-14B-tp8
    revision: null
    role: coder           # bf16 28GB, max_model_len 32768. 1장 적재 tight 하지만 가능.
    gen: true
    enabled: true
    serve_args: []

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen2.5-coder-7b-tp8
    name: Qwen2.5-Coder-7B-tp8
    revision: null
    role: coder           # bf16 15GB, max_model_len 32768.
    gen: true
    enabled: true
    serve_args: []

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen2.5-coder-1.5b-tp8
    name: Qwen2.5-Coder-1.5B-tp8
    revision: null
    role: coder           # bf16 3GB, max_model_len 32768.
    gen: true
    enabled: true
    serve_args: []

  # ==== 추가 로컬 항목 (현재 비활성) ====

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen2.5-coder-32b-tp8
    name: Qwen2.5-Coder-32B-tp8
    revision: null
    role: coder
    gen: true
    enabled: false        # bf16 62GB > 1장 48GB HBM → 서빙 OOM. FP8 양자화 후 재빌드해야 1장 적재.
    serve_args: []

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen3-coder-30b-a3b-tp32
    name: Qwen3-Coder-30B-A3B-bf16-tp32
    revision: null
    role: coder
    gen: true
    enabled: false        # bf16 58GB, tp=32 → RNGD 4장(32 PE) 필요. 4장 머신에서 enabled:true.
    serve_args: []

  # ---- prebuilt 아티팩트 tensor_parallel=32 (RNGD 4장=32 PE) ----
  # Hugging Face 캐시의 snapshot 경로를 직접 로드. 모델별 serve_args에서 4장을 지정.
  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/qwen3-32b-fp8-tp32/snapshots/1f5cf9426425998140e2dde6357ba0ee4f6820b2
    name: Qwen3-32B-FP8-tp32
    revision: null
    role: main
    gen: true
    enabled: true         # 아티팩트 tp=32 → RNGD 4장 사용
    serve_args: ["--reasoning-parser", "qwen3", "--devices", "npu:0,npu:1,npu:2,npu:3"]

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/exaone-4.0-32b-fp8-tp32/snapshots/8c42cdea3e7339fe3e3aefc5c7cff1f66b320f31
    name: EXAONE-4.0-32B-FP8-tp32
    revision: null
    role: main
    gen: true
    enabled: true         # 아티팩트 tp=32 → RNGD 4장 사용
    serve_args: ["--reasoning-parser", "exaone4", "--devices", "npu:0,npu:1,npu:2,npu:3"]

  - id: /home/jun/RNGD-proj/Model_Benchmark/rngd-npu/artifacts/llama-3.3-70b-inst-tp32/snapshots/2cbb7a6286be88e25072e56d3a64943e56408440
    name: Llama-3.3-70B-Instruct-tp32
    revision: null
    role: large
    gen: true
    enabled: true         # 아티팩트 tp=32 → RNGD 4장 사용
    serve_args: ["--tool-call-parser", "llama3_json", "--devices", "npu:0,npu:1,npu:2,npu:3"]

  # ---- retrieval helpers (자체 throughput 측정) ----
  - id: furiosa-ai/Qwen3-Embedding-8B
    revision: null
    role: embedding
    gen: false
    enabled: false
    serve_args: []

  - id: furiosa-ai/Qwen3-Reranker-8B
    revision: null
    role: reranker
    gen: false
    enabled: false
    serve_args: []

# 모든 모델 공통 furiosa-llm serve 인자.
# prefix caching: artifact가 extend bucket 미지원이면 엔진이 자동 비활성.
common_serve_args:
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
  - "--enable-prefix-caching"

# 기본은 단일 NPU. tp=32 모델은 모델별 serve_args에서 4장을 명시.
devices: "npu:0"

# Request shape sweep (tps/sweep 태스크에서 사용).
# prompt_lens는 클라이언트가 생성하는 대략적인 입력 길이. 서버 토크나이즈 결과와 max_tokens의 합이
# 아티팩트 한도를 넘으면 해당 포인트만 실패로 기록하고 다음 포인트로 진행.
# 큰 prompt_len × 큰 concurrency 조합은 긴 컨텍스트 버킷 부족이나 KV OOM으로 실패할 수 있음.
sweep:
  batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
  prompt_lens: [256, 1024, 4096, 8192, 16384, 32768, 65536]
  max_tokens: 512
  warmup_requests: 5
  measured_requests: 30

# Memsweep — furiosa-llm serve 옵션 OFAT 스윕 (baseline에서 한 축씩 변경, 조합마다 재기동).
# 주의: spare_blocks_ratio는 furiosa-llm 2026.2.0에서 deprecated(0.0 외 값은 엔진 패닉) → 축에서 제외.
# max_model_len 상한은 활성 artifact 최대 버킷(131072: EXAONE-4.0-32B-FP8·Llama-3.3-70B)에 맞춤.
# max_num_batched_tokens는 context 길이가 아니라 스케줄러 iteration당 토큰 제한.
# 큰 모델이 큰 옵션을 다 소화하는지 보는 것이 목적. 작은 모델은 자기 artifact 한도를 넘는 값을
# serve가 거부 → 그 포인트만 실패하고 다음으로 넘어감.
# 주의: max_model_len·max_num_batched_tokens를 131072로 키운 조합은 재기동 수가 늘어 측정 시간이
# 크게 증가하고, 큰 batched_tokens는 prefill HBM 부담이 큼 — 4장 환경에서 큰 모델 측정 시 의미 있음.
memsweep:
  baseline: {}
  axes:
    max_model_len: [4096, 8192, 16384, 32768, 40960, 65536, 131072]
    max_batch_size: [8, 16, 32, 64, 128, 256]
    max_num_batched_tokens: [4096, 8192, 16384, 32768, 65536, 131072]
