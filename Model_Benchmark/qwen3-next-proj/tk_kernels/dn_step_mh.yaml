#naive_yaml
# DeltaNet GATED-DELTA-RULE single recurrent step, MULTI-HEAD (H heads at once).
# Extends the proven single-head dn_step.yaml by adding a leading HEAD-BATCH axis
# (label "h") to EVERY tensor and EVERY read/write shape. Each head runs the SAME
# 5 gated-delta equations independently; the contractions stay PER-HEAD (reduce
# axis is still only "k", NEVER "h"). The "h" axis is a genuine batch axis: it is
# present in source storage, is never tiled (broadcast) and never reduced, and
# simply survives through every op into the outputs.
#
# Equations (per head h, in order):
#   S1[h,k,v]   = S[h,k,v] * decay[h,k,v]          (decay materialized to [H,K,V])
#   kv[h,v]     = sum_k S1[h,k,v]*k[h,k]           (EinsumByVe contraction over "k")
#   delta[h,v]  = (v[h,v] - kv[h,v]) * beta[h,v]   (beta materialized to [H,V])
#   Sout[h,k,v] = S1[h,k,v] + k[h,k]*delta[h,v]    (rank-1 outer-product update)
#   out[h,v]    = sum_k Sout[h,k,v]*q[h,k]         (EinsumByVe contraction over "k")
#
# Tensor ids:
#   inputs : 0=S[h,k,v] 1=q[h,k] 2=k[h,k] 3=v[h,v] 4=beta_full[h,v] 5=decay_full[h,k,v]
#   inter  : 6=S1[h,k,v] 7=kv[h,v] 8=tmp[h,v]=(v-kv) 9=delta[h,v] 10=outer[h,k,v] 11=Sout[h,k,v]
#   output : 11=Sout[h,k,v] 12=out[h,v]
#
# Operator chain (next_operator_index=7):
#   op0 Elementwise MulF : S1   = S  * decay   (0,5 -> 6)   reads [h,k,v],[h,k,v]
#   op1 EinsumByVe  ctr  : kv   = sum_k S1*k   (2,6 -> 7)   read0=k[h,k] tiled v, read1=S1[h,k,v]; reduce "k"
#   op2 Elementwise SubF : tmp  = v  - kv      (3,7 -> 8)   reads [h,v],[h,v]
#   op3 Elementwise MulF : delta= tmp* beta    (8,4 -> 9)   reads [h,v],[h,v]
#   op4 EinsumByVe outer : outer= k  * delta   (2,9 -> 10)  read0=k[h,k] tiled v, read1=delta[h,v] tiled k; no reduce
#   op5 Elementwise AddF : Sout = S1 + outer   (6,10 -> 11) reads [h,k,v],[h,k,v]
#   op6 EinsumByVe  ctr  : out  = sum_k Sout*q (1,11 -> 12) read0=q[h,k] tiled v, read1=Sout[h,k,v]; reduce "k"
#
# HEAD-AXIS HANDLING: "h" is the OUTERMOST label in every shape. For the EinsumByVe
# broadcast read0 ([h,k] -> [h,k,v]) the tile adds ONLY the new "v" axis (h,k are
# already in storage). For op4 read1 (delta[h,v] -> [h,k,v]) the tile adds the new
# "k" axis. The reduced axis (Reduce.axes) stays Tag "k" ONLY -- never "h".
---
tensors:
  inner:
    0:   # S[h,k,v]  prior recurrent state
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: K
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    1:   # q[h,k]  query vector (per head)
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: K
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    2:   # k[h,k]  key vector (per head)
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: K
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    3:   # v[h,v]  value vector (per head)
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    4:   # beta_full[h,v]  per-head scalar broadcast over v -> [H,V]
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    5:   # decay_full[h,k,v]  per-head scalar (= exp(g_t)) materialized to [H,K,V]
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: K
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    6:   # S1[h,k,v] = S * decay
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: K
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    7:   # kv[h,v] = sum_k S1[h,k,v]*k[h,k]
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    8:   # tmp[h,v] = v - kv
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    9:   # delta[h,v] = tmp * beta
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    10:  # outer[h,k,v] = k[h,k] * delta[h,v]
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: K
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    11:  # Sout[h,k,v] = S1 + outer   (graph output)
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: K
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    12:  # out[h,v] = sum_k Sout[h,k,v]*q[h,k]   (graph output)
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: H
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
inputs:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
outputs:
  - 11
  - 12
operators:
  operators:
    # op0: S1[h,k,v] = S[h,k,v] * decay_full[h,k,v]   (Elementwise MulF)
    0:
      name: dn_step_decay
      option:
        SymTacticKernel:
          inputs:
            - 0
            - 5
          output: 6
          inner:
            inner:
              reads:
                - input:
                    shape:
                      inner:
                        - tag:
                            LabelStride:
                              label:
                                inner: "h"
                              stride: 1
                          size:
                            Var: H
                        - tag:
                            LabelStride:
                              label:
                                inner: "k"
                              stride: 1
                          size:
                            Var: K
                        - tag:
                            LabelStride:
                              label:
                                inner: "v"
                              stride: 1
                          size:
                            Var: V
                    element_type: Float32
                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
                - input:
                    shape:
                      inner:
                        - tag:
                            LabelStride:
                              label:
                                inner: "h"
                              stride: 1
                          size:
                            Var: H
                        - tag:
                            LabelStride:
                              label:
                                inner: "k"
                              stride: 1
                          size:
                            Var: K
                        - tag:
                            LabelStride:
                              label:
                                inner: "v"
                              stride: 1
                          size:
                            Var: V
                    element_type: Float32
                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
              ein_ops: ~
              vector_ops:
                inputs:
                  - 0
                  - 1
                insts:
                  - def: 2
                    expr:
                      Binary:
                        operator: MulF
                        lhs:
                          Tensor: 0
                        rhs:
                          Tensor: 1
                    source: ""
              write:
                input:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "h"
                            stride: 1
                        size:
                          Var: H
                      - tag:
                          LabelStride:
                            label:
                              inner: "k"
                            stride: 1
                        size:
                          Var: K
                      - tag:
