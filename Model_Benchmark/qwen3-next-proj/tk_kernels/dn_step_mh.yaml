            sparsity: None
    # op1: kv[h,v] = sum_k S1[h,k,v]*k[h,k]   (EinsumByVe contraction over "k")
    #   read0 = k[h,k] broadcast (tiled) along new axis "v"  (broadcast read MUST be read0)
    #   read1 = S1[h,k,v]   reduce axis = "k" ONLY (h survives)
    1:
      name: dn_step_kv_read
      option:
        SymTacticKernel:
          inputs:
            - 2
            - 6
          output: 7
          inner:
            inner:
