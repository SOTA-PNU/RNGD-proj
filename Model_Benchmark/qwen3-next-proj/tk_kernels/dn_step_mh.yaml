                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
              ein_ops: ~
              vector_ops:
                inputs:
                  - 0
                  - 1
                insts:
                  - def: 2
                    expr:
                      Binary:
                        operator: MulF
                        lhs:
                          Tensor: 0
                        rhs:
                          Tensor: 1
                    source: ""
                  - def: 3
                    expr:
                      Reduce:
                        operator: LocalReduceAddF
                        operand:
                          Tensor: 2
                        axes:
                          Tag:
                            - inner: "k"
                    source: ""
              write:
                input:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "h"
                            stride: 1
                        size:
                          Var: H
                      - tag:
                          LabelStride:
                            label:
                              inner: "v"
                            stride: 1
                        size:
                          Var: V
                  element_type: Float32
                output:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "h"
                            stride: 1
                        size:
                          Var: H
                      - tag:
                          LabelStride:
                            label:
                              inner: "v"
                            stride: 1
                        size:
                          Var: V
                  element_type: Float32
                has_transmutation: false
            kind: EinsumByVe
            sparsity: None
    # op2: tmp[h,v] = v[h,v] - kv[h,v]   (Elementwise SubF)
    2:
