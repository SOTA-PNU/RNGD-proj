                              label:
                                inner: "h"
                              stride: 1
                          size:
                            Var: H
                        - tag:
                            LabelStride:
                              label:
                                inner: "k"
                              stride: 1
                          size:
                            Var: K
                    element_type: Float32
                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles:
