#naive_yaml
# DeltaNet DELTA update:  delta[v] = (v_vec[v] - kv[v]) * beta
#
# Two CHAINED ops on a [V] vector (fp32):
#   op0 (SubF):  tmp[v]   = v_vec[v] - kv[v]          (tensors 0,1 -> 3)
#   op1 (MulF):  delta[v] = tmp[v]   * beta[v]        (tensors 3,2 -> 4)
# op1 consumes op0's output tensor (id 3) -> DFG chaining. The intermediate
# tensor 3 is declared in tensors.inner; next_operator_index = 2.
#
# SCALAR-BROADCAST CHOICE (verified): `beta` is passed as a SAME-SHAPE [V]
# input (caller does beta.expand(V) / torch.full((V,), beta)). A [1] scalar
# cannot be broadcast to [V] in #naive_yaml Elementwise: tiles add a new axis
# (rank+1, residual size-1), a stride-0 base of size V over a [1] storage gives
# "Input tensor mismatch", and a same-rank size-1 axis does not auto-broadcast.
# fp32 binary ops are SubF / MulF (the *Fxp variants are integer-only).
---
tensors:
  inner:
    0:   # v_vec[v]
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    1:   # kv[v]
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    2:   # beta[v] : scalar materialized to [V] by the caller
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    3:   # tmp[v] = v_vec - kv (intermediate, fed into op1)
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
    4:   # delta[v] (output)
      shape:
        DynamicUnlabeledShape:
          inner:
            sizes:
              - Var: V
      element_type: Float32
      buffer: []
      name: ""
      source: Unknown
      buffer_type: Sram
inputs:
  - 0
  - 1
  - 2
outputs:
  - 4
operators:
  operators:
    0:
      name: deltanet_delta_sub
      option:
        SymTacticKernel:
          inputs:
            - 0
            - 1
          output: 3
          inner:
            inner:
              reads:
                - input:
                    shape:
                      inner:
                        - tag:
                            LabelStride:
                              label:
                                inner: "0"
                              stride: 1
                          size:
                            Var: V
                    element_type: Float32
                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
                - input:
                    shape:
                      inner:
                        - tag:
                            LabelStride:
                              label:
                                inner: "0"
                              stride: 1
                          size:
                            Var: V
                    element_type: Float32
                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
              ein_ops: ~
              vector_ops:
                inputs:
                  - 0
                  - 1
                insts:
                  - def: 2
                    expr:
                      Binary:
                        operator: SubF
                        lhs:
                          Tensor: 0
                        rhs:
                          Tensor: 1
                    source: ""
              write:
                input:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "0"
                            stride: 1
                        size:
                          Var: V
                  element_type: Float32
                output:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "0"
                            stride: 1
                        size:
                          Var: V
                  element_type: Float32
                has_transmutation: false
            kind: Elementwise
            sparsity: None
    1:
      name: deltanet_delta_mul_beta
      option:
        SymTacticKernel:
          inputs:
            - 3
            - 2
          output: 4
          inner:
            inner:
              reads:
                - input:
                    shape:
                      inner:
                        - tag:
                            LabelStride:
                              label:
                                inner: "0"
                              stride: 1
                          size:
                            Var: V
                    element_type: Float32
                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
                - input:
                    shape:
                      inner:
                        - tag:
                            LabelStride:
                              label:
                                inner: "0"
                              stride: 1
                          size:
                            Var: V
                    element_type: Float32
                  table_lookup: None
                  has_transmutation: false
                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
              ein_ops: ~
              vector_ops:
                inputs:
                  - 0
                  - 1
                insts:
                  - def: 2
                    expr:
                      Binary:
                        operator: MulF
                        lhs:
                          Tensor: 0
                        rhs:
                          Tensor: 1
                    source: ""
              write:
                input:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "0"
                            stride: 1
                        size:
                          Var: V
                  element_type: Float32
                output:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "0"
                            stride: 1
                        size:
                          Var: V
                  element_type: Float32
                has_transmutation: false
            kind: Elementwise
            sparsity: None
  next_operator_index: 2
hidden_outputs: []
