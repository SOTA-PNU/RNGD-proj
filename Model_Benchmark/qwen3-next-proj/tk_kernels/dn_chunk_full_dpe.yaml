#naive_yaml
# AUTO-GENERATED by gen_chunk_full.py (dpe=True, dpe_max=None): ONE FULL CHUNK
# with inter-chunk state carry, but ALL 5 internal matmul ops run on the FAST DPE
# (systolic MAC) engine (kind: EinsumByDpe) instead of the VECTOR engine
# (EinsumByVe). The pure-elementwise ops (decay mul, sub, add) stay Elementwise.
# Proven DPE recipe from dn_linear_dpe.yaml / dpe_incremental_log.md: the
# contraction moves into ein_ops.reduce (pre-reduce product = [write axes...,
# contracted axis]) and vector_ops becomes a single identity passthrough (empty-
# axes LocalReduceAddF). DPE is bf16 systolic so expect ~0.23% relmean (validate
# at atol 1e-2, NOT 1e-3).
# WARNING: with all 5 matmuls on DPE this graph DOES NOT match HF -- the
# TacticKernel lowering corrupts graphs with >2 EinsumByDpe ops (out maxabs
# ~0.5, dfg_inner still 0). Use dn_chunk_full_dpe2.yaml (dpe_max=2) for a
# variant that actually validates at atol 1e-2.
# Inputs: 0=q[c,k] 1=kk[d,k] 2=value[d,v] 3=decay_strict[c,d] 4=kcd[d,k]
#         5=gexp_k[c,k] 6=wdecay[d,k] 7=sdecay[k,v] 8=Sprev[k,v].
# Outputs: 17=out[c,v]  20=Snext[k,v].
