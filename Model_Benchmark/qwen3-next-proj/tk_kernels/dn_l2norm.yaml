#naive_yaml
# L2NORM over feature dim: y = x*rsqrt(sum_d x^2 + eps).
# Reduce ops use a [d,m] copy of x (reduce OUTER d, survive INNER m) so the
# adder-tree lowers to NPU; scale-back uses [m,d] (read0=inv tiled d -> [m,d] out).
# rt=Sqrt(se) ; inv=rt/se == 1/sqrt(se) (no native rsqrt; DivF(one,rt) collapses to rt).
