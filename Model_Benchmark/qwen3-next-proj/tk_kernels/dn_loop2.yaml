#naive_yaml
# Carried-state accumulate loop:  S += X[i]  for i in range(T)  =>  S = sum_i X[i]
# This is the FURTHEST-REACHING variant (Variant B). It PARSES, but is rejected
# at the loop-index SEMANTIC check (loop_impl.rs:126) on BOTH the CPU executor
# AND the NPU compiler. See the full result log below.
#
# ---------------------------------------------------------------------------
# PRIOR BLOCKER (dn_loop.yaml): the loop_index local tensor used a
# DynamicUnlabeledShape whose only sizes form is {Var: "<name>"}; the executor
# treats that as an UNRESOLVED symbolic variable ("SymExpr is not a constant
# integer: 1"). naive_yaml's DynamicUnlabeledShape genuinely cannot hold a
# constant: {Const: 1} is rejected at parse, only {Var: "<str>"} is accepted.
#
# FIX APPLIED HERE: tensor shapes ALSO accept a *static* `UnlabeledShape` whose
# `sizes` are PLAIN INTEGERS, e.g. {UnlabeledShape: {inner: {sizes: [1]}}}.
# (Confirmed: round-trips through serialize as sizes:[\x01] = concrete int 1.)
# The loop_index local tensor (id 6) below uses this static [1] shape with
# element_type Index (validation requires input.element_type.is_index()).
# This DEFEATS the "SymExpr is not a constant integer" error -> we now reach the
# real loop validity check.
#
# REMAINING BLOCKER (vendor-only): loop_impl.rs:126 bails with
#   "loop index tensor must be either SPM scalar or unlabeled [1], got: [1]"
# i.e. our shape prints as exactly "[1]" yet still fails the equality. The check
# is `is_spm_scalar(shape) || shape.as_unlabeled()? == UnlabeledShape::new([1])`.
# Our parse-time static UnlabeledShape{[1]} (buffer Sram OR Spm) is NOT considered
# equal to the loop's internally-constructed UnlabeledShape::new([1]); the only
# other accepted form is a true hardware-lowered SpmShape{chip,cluster,pe,in_pe}
# which is a post-scheduler structure not authorable in naive_yaml.
#
# VARIANTS TESTED (all reach the SAME loop_impl.rs:126 gate or earlier):
#   B1 UnlabeledShape[1] + Sram  -> "got: [1]"            (this file)
#   B2 UnlabeledShape[1] + Spm   -> "got: [1]"
#   B3 WrappedScalarShape + Spm  -> "got: WrappedScalarShape"
#   B4 WrappedScalarShape + Sram -> "got: WrappedScalarShape"
#   []  (0-dim UnlabeledShape)   -> "got: []"
#   DynamicUnlabeledShape {Var}  -> "SymExpr is not a constant integer" (earlier)
#   Variant A (loop_index -> a TOP-LEVEL graph input tensor of shape [1]): PARSES,
#     and that input IS resolved to ConstInt(1) at runtime, BUT the loop body
#     cannot reference an outer tensor: "no tensor exists for T7". loop_index MUST
#     be a local_tensor of the loop body.
#
# CONCLUSION: the graph-internal recurrence frontier (Loop op) is VENDOR-ONLY in
# 2026.2.0 for naive_yaml authoring. The loop_index must be an SPM scalar that
# only the scheduler/lowering produces; naive_yaml cannot mint one. No Loop op
# appears in any shipped naive_yaml kernel either (grep across the package = 0).
---
tensors:
  inner:
    0:
      shape: {DynamicUnlabeledShape: {inner: {sizes: [{Var: "4"}]}}}
      element_type: Float32
      buffer: []
      name: "S_init"
      source: Unknown
      buffer_type: Sram
    1:
      shape: {DynamicUnlabeledShape: {inner: {sizes: [{Var: "3"}, {Var: "4"}]}}}
      element_type: Float32
      buffer: []
      name: "X_seq"
      source: Unknown
      buffer_type: Sram
    2:
      shape: {DynamicUnlabeledShape: {inner: {sizes: [{Var: "4"}]}}}
      element_type: Float32
      buffer: []
      name: "S_final"
      source: Unknown
      buffer_type: Sram
inputs:
  - 0
  - 1
outputs:
  - 2
operators:
  operators:
    0:
      name: deltanet_loop
      option:
        Loop:
          inner:
            operators:
              - name: step_accumulate
                option:
                  SymTacticKernel:
                    inputs:
                      - 3
                      - 4
                    output: 5
                    inner:
                      inner:
                        reads:
                          - input:
                              shape:
                                inner:
                                  - tag: {LabelStride: {label: {inner: "0"}, stride: 1}}
                                    size: {Var: "4"}
                              element_type: Float32
                            table_lookup: None
                            has_transmutation: false
                            subtraction: None
                            paddings: []
                            slides: []
                            strides: []
                            tiles: []
                          - input:
                              shape:
                                inner:
                                  - tag: {LabelStride: {label: {inner: "0"}, stride: 1}}
                                    size: {Var: "4"}
                              element_type: Float32
                            table_lookup: None
                            has_transmutation: false
                            subtraction: None
                            paddings: []
                            slides: []
                            strides: []
                            tiles: []
                        ein_ops: ~
                        vector_ops:
                          inputs:
                            - 0
                            - 1
                          insts:
                            - def: 2
                              expr:
                                Binary:
                                  operator: AddF
                                  lhs: {Tensor: 0}
                                  rhs: {Tensor: 1}
                              source: ""
                        write:
                          input:
                            shape:
                              inner:
                                - tag: {LabelStride: {label: {inner: "0"}, stride: 1}}
                                  size: {Var: "4"}
                            element_type: Float32
                          output:
                            shape:
                              inner:
                                - tag: {LabelStride: {label: {inner: "0"}, stride: 1}}
                                  size: {Var: "4"}
                            element_type: Float32
                          has_transmutation: false
                      kind: Elementwise
                      sparsity: None
            interface:
              loop_index: 6
              limit: 3
              dynamic_limit: ~
              initial_states:
                - 0
              captured_inputs:
                - 1
              final_states:
                - 2
              local_tensors:
                inner:
                  3:
                    shape: {DynamicUnlabeledShape: {inner: {sizes: [{Var: "4"}]}}}
                    element_type: Float32
                    buffer: []
                    name: "S_inner_in"
                    source: Unknown
                    buffer_type: Sram
                  4:
                    shape: {DynamicUnlabeledShape: {inner: {sizes: [{Var: "4"}]}}}
                    element_type: Float32
                    buffer: []
                    name: "X_step"
                    source: Unknown
                    buffer_type: Sram
                  5:
                    shape: {DynamicUnlabeledShape: {inner: {sizes: [{Var: "4"}]}}}
                    element_type: Float32
                    buffer: []
