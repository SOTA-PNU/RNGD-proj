            sparsity: None
    # op1: kv[v] = sum_k S1[k,v]*k[k]   (EinsumByVe contraction)
    #   read0 = k[k] broadcast along new axis "v"  (broadcast read MUST be read0)
    #   read1 = S1[k,v]
    1:
      name: dn_step_kv_read
      option:
        SymTacticKernel:
          inputs:
            - 2
            - 6
          output: 7
          inner:
            inner:
              reads:
                - input:
                    shape:
                      inner:
                        - tag:
                            LabelStride:
                              label:
                                inner: "k"
                              stride: 1
                          size:
                            Var: K
