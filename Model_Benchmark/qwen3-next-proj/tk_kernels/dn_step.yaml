                          Tensor: 1
                    source: ""
                  - def: 3
                    expr:
                      Reduce:
                        operator: LocalReduceAddF
                        operand:
                          Tensor: 2
                        axes:
                          Tag:
                            - inner: "k"
                    source: ""
              write:
                input:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "v"
                            stride: 1
                        size:
                          Var: V
                  element_type: Float32
