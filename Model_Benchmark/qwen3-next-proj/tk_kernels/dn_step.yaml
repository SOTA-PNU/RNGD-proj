                  subtraction: None
                  paddings: []
                  slides: []
                  strides: []
                  tiles: []
              ein_ops: ~
              vector_ops:
                inputs:
                  - 0
                  - 1
                insts:
                  - def: 2
                    expr:
                      Binary:
                        operator: MulF
                        lhs:
                          Tensor: 0
                        rhs:
                          Tensor: 1
                    source: ""
              write:
                input:
                  shape:
                    inner:
                      - tag:
                          LabelStride:
                            label:
                              inner: "k"
                            stride: 1
                        size:
                          Var: K
                      - tag:
